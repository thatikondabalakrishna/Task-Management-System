<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Task Manager | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Poppins', sans-serif;
}

html, body {
    height: 100%;
    margin: 0;
}

body {
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("https://images.unsplash.com/photo-1553877522-43269d4ea984")
        no-repeat center center / cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    border-radius: 16px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.95);
    border: none;
}

.card-header {
    background: transparent;
    border-bottom: none;
    text-align: center;
}

.card-header h4 {
    font-weight: 600;
    color: #0d6efd;
}

.card-header small {
    color: #6c757d;
}

.form-control {
    border-radius: 8px;
    padding: 10px;
}

.btn-primary {
    border-radius: 30px;
    padding: 10px 25px;
}

.btn-outline-secondary {
    border-radius: 30px;
    padding: 10px 25px;
}
</style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-lg">

                <div class="card-header pt-4">
                    <h4>Create Your Account</h4>
                    <small>Join the Task Management System</small>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/registration}" method="post"
                          onsubmit="return validatePasswords();">

                        <div class="row">
                            <!-- LEFT COLUMN -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">User Name</label>
                                    <input type="text" class="form-control"
                                           id="userName" name="userName" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control"
                                           id="Email" name="Email" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <input type="text" class="form-control"
                                           id="role" name="role"
                                           placeholder="Admin / Manager / User" required>
                                </div>
                            </div>

                            <!-- RIGHT COLUMN -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Manager Username</label>
                                    <input type="text" class="form-control"
                                           id="managerUsername" name="managerUsername"
                                           placeholder="Optional">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control"
                                           id="Password" name="Password" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control"
                                           id="RPassword" name="RPassword" required>
                                </div>
                            </div>
                        </div>

                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="ClearData();">
                                Clear
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>
                        </div>

                        <!-- ALERTS -->
                        <div th:if="${error}" class="alert alert-danger mt-3 text-center"
                             th:text="${error}"></div>

                        <div th:if="${Status}" class="alert alert-success mt-3 text-center"
                             th:text="${Status}"></div>

                        <div class="text-center mt-4">
                            <span>Already have an account?</span>
                            <a th:href="@{/login}"> Login</a>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function ClearData() {
    userName.value = "";
    Email.value = "";
    role.value = "";
    managerUsername.value = "";
    Password.value = "";
    RPassword.value = "";
}

function validatePasswords() {
    if (Password.value !== RPassword.value) {
        alert("Passwords do not match!");
        return false;
    }
    return true;
}
</script>

</body>
</html>
