<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>registration Page</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
html, body {
	height: 100%;
	margin: 0;
}

body {
	background-color: #f8f9fa;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-container {
	width: 100%;
	max-width: 400px;
	padding: 2rem;
	background-color: #fff;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-sm-10 col-md-8 col-lg-5">
				<div class="card shadow-lg">
					<div class="card-header  text-black text-center py-3">
						<h4 class="mb-0">Register</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/registration}" method="post" onsubmit="return validatePasswords();">
							<div class="mb-3">
								<label for="userName" class="form-label mb-2">User Name</label>
								<input type="text" class="form-control" id="userName"
									name="userName" required>
							</div>
							<div class="mb-3">
								<label for="Email" class="form-label mb-2">Email</label> <input
									type="email" class="form-control" id="Email" name="Email"
									required>
							</div>

							<div class="mb-3">
								<label for="Password" class="form-label mb-2">Password</label> <input
									type="password" class="form-control" id="Password"
									name="Password" required>
							</div>

							<div class="mb-3">
								<label for="Password" class="form-label mb-2">ReEnter
									Password</label> <input type="password" class="form-control"
									id="RPassword" name="RPassword" required>
							</div>
 
							<div class="mb-3 ml-4">
							<button type="text" class="btn btn-primary" id="Clear"
									name="Clear" onclick="ClearData();">Clear</button>
									
								<button type="submit" class="btn btn-primary" id="Register"
									name="Register">Register</button>
							</div>
							<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                            <div th:if="${Status}" class="alert alert-success" th:text="${Status}"></div>
                            
							<div class="text-center">
								<label class="form-label">Do you want to Login? <a
									th:href="@{/login}">Login</a>
								</label>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- Bootstrap JS (Optional) -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		
  <script>
  function ClearData() {
	  document.getElementById('userName').value="";
	    document.getElementById('Email').value="";
	document.getElementById('Password').value="";
    document.getElementById('RPassword').value="";
  }
  
  function validatePasswords() {
      const password = document.getElementById('Password').value;
      const confirmPassword = document.getElementById('RPassword').value;

      if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return false; // prevent form submission
      }
      return true; // allow form submission
  }
  </script>		

</body>
</html>
