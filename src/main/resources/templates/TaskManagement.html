<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Task Management System</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.css">

<style>
body { background-color: #f8f9fa; }

.table-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

#TaskData tbody tr:hover {
    background-color: #eef4ff;
    cursor: pointer;
}

.selected-row {
    background-color: #0d6efd !important;
    color: white;
}
.selected-row td { color: white !important; }

.dataTables_filter input {
    border-radius: 20px;
    padding: 5px 12px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>

</head>

<body>

<!-- ✅ COMMON NAVBAR -->
<div th:replace="fragments/navbar :: navbar('Task Management')"></div>

<!-- STATUS FILTER -->
<div class="container mt-3">
  <div class="row justify-content-between">

    <div class="col-md-3">
        <button class="btn btn-primary" id="addNewTaskLink">
            <i class="fa fa-plus"></i> Add Task
        </button>
    </div>

    <div class="col-md-3">
      <select class="form-select" id="statusFilter">
        <option value="ALL">All Status</option>
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
        <option value="OVERDUE">Overdue</option>
      </select>
    </div>

  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-4">

    <div class="page-header mb-3">
        <h4 class="fw-bold">Task List</h4>
    </div>

    <div class="table-card">

        <table id="TaskData" class="table table-hover text-center align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Assignee</th>
                    <th>Task</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th style="width:120px;">Actions</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>

    </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="taskModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="fa fa-tasks"></i> Task Details
        </h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="taskForm">

          <input type="hidden" id="taskId">

          <div class="mb-3">
            <label>Assignee</label>
            <input type="text" id="assignee" class="form-control">
          </div>

          <div class="mb-3">
            <label>Task Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>Description</label>
            <textarea id="description" class="form-control"></textarea>
          </div>

          <div class="row">
              <div class="col-md-6 mb-3">
                  <label>Due Date</label>
                  <input type="date" id="duedate" class="form-control">
              </div>

              <div class="col-md-6 mb-3">
                  <label>Status</label>
                  <select id="status" class="form-select">
                      <option value="PENDING">Pending</option>
                      <option value="IN_PROGRESS">In Progress</option>
                      <option value="COMPLETED">Completed</option>
                      <option value="OVERDUE">Overdue</option>
                  </select>
              </div>
          </div>

          <button class="btn btn-primary w-100">
              <i class="fa fa-save"></i> Save Task
          </button>

        </form>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/TaskManagement.js"></script>

</body>
</html>
