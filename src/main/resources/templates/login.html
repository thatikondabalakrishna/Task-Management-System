<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
html, body {
	height: 100%;
	margin: 0;
}

body {
	background-color: #cdd7d4;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-container {
	width: 100%;
	max-width: 400px;
	padding: 2rem;
	background-color: #fff;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-sm-10 col-md-8 col-lg-5">
				<div class="card shadow-lg">
					<div class="card-header text-info text-center py-3">
						<h4 class="mb-0">Login</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/loginAccount}" method="post">
							<div class="mb-3">
								<label for="userName" class="form-label mb-2">User Name
									/ Email</label> <input type="text" class="form-control" id="userName"
									name="userName" required>
							</div>

							<div class="mb-3">
								<label for="Password" class="form-label mb-2">Password</label> <input
									type="password" class="form-control" id="Password"
									name="Password" required>
							</div>

							<div class="d-grid mb-3">

								<button type="submit" class="btn btn-primary mb-4" id="submit"
									name="submit">Login</button>
							</div>
							<div th:if="${error}" class="alert alert-danger"
								th:text="${error}"></div>
							<div th:if="${Status}" class="alert alert-success"
								th:text="${Status}"></div>
							<div class="text-center">
								<label class="form-label"> Don't have an account? <a
									th:href="@{/Register}">Register</a>
								</label>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- Bootstrap JS (Optional) -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
