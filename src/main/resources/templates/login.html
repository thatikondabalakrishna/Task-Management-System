<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Task Manager | Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Poppins', sans-serif;
}

html, body {
    height: 100%;
    margin: 0;
}

/* Task Management Background */
body {
    background:
        linear-gradient(
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.45)
        ),
        url("https://images.unsplash.com/photo-1552664730-d307ca884978") 
        no-repeat center center / cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.card {
    border-radius: 16px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.94);
    border: none;
    animation: fadeIn 0.8s ease-in-out;
}

/* Header – Soft & Professional */
.card-header {
    background: transparent;
    border-bottom: none;
    text-align: center;
}

.card-header h4 {
    font-weight: 600;
    color: #0d6efd;
}

.card-header small {
    color: #6c757d;
}

/* Inputs */
.form-control {
    border-radius: 8px;
    padding: 10px;
}

.form-control:focus {
    box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
}

/* Button */
.btn-primary {
    border-radius: 30px;
    padding: 10px;
    font-weight: 500;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(13, 110, 253, 0.35);
}

/* Links */
a {
    text-decoration: none;
    font-weight: 500;
}

a:hover {
    text-decoration: underline;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow-lg">

                <div class="card-header pt-4">
                    <h4>Task Management System</h4>
                    <small>Plan • Track • Complete your work efficiently</small>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/loginAccount}" method="post">

                        <div class="mb-3">
                            <label class="form-label">User Name</label>
                            <input type="text" class="form-control"
                                   name="userName" placeholder="Enter username or email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control"
                                   name="Password" placeholder="Enter password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                Login
                            </button>
                        </div>

                        <div th:if="${error}" class="alert alert-danger text-center"
                             th:text="${error}"></div>

                        <div th:if="${Status}" class="alert alert-success text-center"
                             th:text="${Status}"></div>

                        <div class="text-center mt-3">
                            <span>Don’t have an account?</span>
                            <a th:href="@{/Register}"> Register</a>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
