<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">
<style type="text/css">
.dataTables_wrapper .dataTables_filter {
    text-align: center !important;
    margin-bottom: 10px;
}

</style>
<title>Task List</title>

  <!-- ✅ Bootstrap CSS (add this!) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.css">

<style>
table {
	width: 80%;
	border-collapse: collapse;
	margin: 20px auto;
}

th, td {
	border: 1px solid #ddd;
	padding: 12px;
	text-align: left;
}

th {
	background-color: #f4f4f4;
}
</style>
<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>
<script src="/js/TaskManagement.js"></script>
</head>
<body>
	<!-- <h2 style="text-align: center;">All Tasks</h2> -->
	
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">TMS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      
        <li class="nav-item">
          <a class="nav-link active" href="#" id="viewAllTasks">View All Task</a>
        </li>
      <li class="nav-item">
      <a class="nav-link" href="#" id="addNewTaskLink">Add New Task</a>
     </li>

       
       <!--  <li class="nav-item">
          <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
        </li> -->
      </ul>
      <form class="d-flex" th:action="@{/Logout}" method="post">
        <!-- <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"> -->
        <button class="btn btn-outline-success" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

	<div class="d-flex justify-content-center mt-4">
    <div class="table-responsive" style="width: 90%;">
        <table id="TaskData" class="display table table-bordered table-striped text-center border-dark">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Assignee</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskTableBody">
                <!-- JavaScript will inject rows here -->
            </tbody>
        </table>
    </div>
</div>


<!-- Edit Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
    
      <div class="modal-header">
        <h5 class="modal-title" id="editTaskModalLabel"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body">
        <form id="UpdateTask"  data-mode="create" onsubmit="CreateUpdateTask(event)">
          <input type="hidden" id="editTaskId">
          
           <div class="mb-3">
            <label for="editTaskName" class="form-label">Id No</label>
            <input type="text" class="form-control" id="Id">
          </div>
          
           <div class="mb-3">
            <label for="editAssignee" class="form-label">Assignee</label>
            <input type="text" class="form-control" id="assignee" >
          </div>
          
          <div class="mb-3">
            <label for="editTaskName" class="form-label">Task Name</label>
            <input type="text" class="form-control" id=name >
          </div>
          
          <div class="mb-3">
            <label for="editTaskDesc" class="form-label">Description</label>
            <textarea class="form-control" id="description"></textarea>
          </div>
          
           <div class="mb-3">
            <label for="editDueDate" class="form-label">Due Date</label>
            <input type="date" class="form-control" id="duedate" >
          </div>
          
          <div class="mb-3">
            <label for="editTaskStatus" class="form-label">Status</label>
            <select class="form-control" id="status">
              <option value="Completed">Completed</option>
              <option value="OverDue">Over Due</option>
              <option value="Inprogress">In progress</option>
            </select>
          </div>
          
          <button type="submit" class="btn bg-primary text-white" id="modalsubmit"></button>
        </form>
      </div>
      
    </div>
  </div>
</div>



</body>
</html>
