<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* Background */
body {
    background: #f4f6f9;
}

/* Dashboard cards */
.card-box {
    border-radius: 12px;
    padding: 20px;
    color: white;
    text-align: center;
    transition: transform 0.2s ease;
}

.card-box:hover {
    transform: translateY(-5px);
}

/* Colors */
.bg-blue { background: #0d6efd; }
.bg-green { background: #198754; }
.bg-yellow { background: #ffc107; color: black; }
.bg-red { background: #dc3545; }

/* Chart card */
.chart-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    text-align: center;
}

/* Small chart container */
.chart-container {
    width: 260px;
    height: 260px;
    margin: auto;
}

</style>

</head>

<body>

<!-- ✅ COMMON NAVBAR -->
<div th:replace="fragments/navbar :: navbar('Task Management System')"></div>

<!-- ✅ DASHBOARD CARDS -->
<div class="container mt-4">
<div class="row text-center g-3">

    <div class="col-md-3">
        <div class="card-box bg-blue shadow">
            <h6>Total Tasks</h6>
            <h3 id="total">0</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card-box bg-green shadow">
            <h6>Completed</h6>
            <h3 id="completed">0</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card-box bg-yellow shadow">
            <h6>Pending</h6>
            <h3 id="pending">0</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card-box bg-red shadow">
            <h6>Overdue</h6>
            <h3 id="overdue">0</h3>
        </div>
    </div>

</div>
</div>

<!-- ✅ SMALL CHART -->
<div class="container">
    <div class="chart-card">

        <h6 class="mb-3">Task Status Overview</h6>

        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>

    </div>
</div>

<!-- JS -->
<script src="/js/dashboard.js"></script>

</body>
</html>
